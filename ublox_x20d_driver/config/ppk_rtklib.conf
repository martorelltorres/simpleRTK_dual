# RTKLIB post-processing options for scripts/ppk_process.py (rnx2rtkp -k).
# Kinematic PPK of the ZED-X20D rover against a reference station RINEX file.
# Option names and values follow RTKLIB's options.c; edit them here, not on the command line.

pos1-posmode       =kinematic       # 0:single,1:dgps,2:kinematic,3:static,...
pos1-frequency     =l1+l2+l5        # 1:l1,2:l1+l2,3:l1+l2+l5
pos1-soltype       =combined        # forward and backward filters combined (post-processing)
pos1-elmask        =15              # deg
pos1-dynamics      =on
pos1-ionoopt       =brdc            # short baselines: broadcast model is enough
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =45              # 1:gps + 4:glo + 8:gal + 32:bds

pos2-armode        =continuous      # integer ambiguity resolution
pos2-gloarmode     =off             # GLONASS inter-frequency biases differ between receiver makes
pos2-bdsarmode     =on
pos2-arthres       =3

out-solformat      =llh
out-outhead        =on
out-timesys        =gpst            # scripts/ppk_fuse.py expects GPS time
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-height         =ellipsoidal     # same height as ~fix (NAV-HPPOSLLH height)

# Reference station: MAL1 (IGN ERGNSS, Palma de Mallorca tide gauge, IERS 13444M002).
# Coordinates of the station mark from its IGN station sheet (ETRS89, so the PPK solution is
# in ETRS89 too):
#   latitude 39 33' 36.63673" N, longitude 2 38' 14.83584" E, ellipsoidal height 53.787 m
# The antenna (LEIAR20 LEIM) stands 0.0350 m above the mark (to the antenna reference point).
# For another station, replace these values with those of its sheet.
ant2-postype       =llh
ant2-pos1          =39.560176869    # deg
ant2-pos2          =2.637454400     # deg
ant2-pos3          =53.787          # m, ellipsoidal
ant2-antdelu       =0.0350          # m, mark to antenna reference point
# Antenna type and height from the RINEX header (they match the station sheet). Its phase
# centre calibration is applied when ppk_process.py is given an ANTEX file (--antex).
ant2-anttype       =*
